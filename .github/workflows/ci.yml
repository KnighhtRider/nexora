name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate initial Chromium visual baselines for review
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Do not install git hooks in CI; they protect a developer's commits, not a
  # throwaway runner.
  HUSKY: "0"

jobs:
  verify:
    name: Verify (format, lint, types, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: E2E + a11y (Chromium)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # --with-deps installs the Ubuntu shared libraries the browser needs.
      - run: npx playwright install --with-deps chromium
      - name: Generate visual baselines for review
        if: ${{ inputs.update_visual_baselines == true }}
        run: npm run test:visual -- --update-snapshots
      - run: npm run test:e2e
      - name: Upload generated visual baselines
        uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.update_visual_baselines == true }}
        with:
          name: visual-baselines
          path: tests/e2e/design-system.visual.spec.ts-snapshots/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
